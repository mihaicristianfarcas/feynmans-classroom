name: Idea or feature request
description: Something the app should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to learn or do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
