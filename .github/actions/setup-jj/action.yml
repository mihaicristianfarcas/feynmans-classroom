# Puts Jujutsu (jj) on PATH: the vault's history, the agent's changes and the tests all need it. The
# version is pinned and the download checked against the release's SHA-256 (as GitHub lists it for the
# release asset); to update, change both.
name: Set up Jujutsu
description: Installs a pinned jj release for Linux x86_64 and puts it on PATH.
runs:
  using: composite
  steps:
    - name: Install jj
      shell: bash
      env:
        JJ_VERSION: 0.46.0
        JJ_SHA256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
      run: |
        set -euo pipefail
        file="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" \
          "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/${file}"
        echo "${JJ_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/jj"
        tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/jj" ./jj
        echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/jj/jj" --version
