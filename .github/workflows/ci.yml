# Every pull request (and every change to main) must pass these checks before it can merge.
# The ruleset in .github/rulesets/main.json requires the "CI passed" job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Formatting and lint
        run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  accessibility:
    name: Accessibility (axe, keyboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # a production server on a throwaway vault, seeded with a small book
      - run: npm run test:a11y -- --serve

  passed:
    name: CI passed
    if: always()
    needs: [verify, accessibility]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success && test "${{ needs.accessibility.result }}" = success
