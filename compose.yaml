# `docker compose up`, then http://localhost:5173. See docs/docker.md.
services:
  app:
    build: .
    pull_policy: build
    init: true
    ports:
      - "127.0.0.1:${CLASSROOM_API_PORT:-8787}:8787"
      - "127.0.0.1:${CLASSROOM_WEB_PORT:-5173}:5173"
    environment:
      DATA_DIR: /data
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${CLASSROOM_DATA:-./data}:/data
      - home:/home/node
    # what the agents' sandbox (bubblewrap) needs: user namespaces and a /proc it can mount
    security_opt:
      - seccomp=docker/seccomp.json
      - systempaths=unconfined

volumes:
  node_modules:
  home:
