<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1d20" media="(prefers-color-scheme: dark)" />
    <title>Feynman's Classroom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='7' cy='10' r='6' fill='%23cbc3f1'/%3E%3Ccircle cx='13' cy='10' r='6' fill='%23f3c9b0' style='mix-blend-mode:multiply'/%3E%3C/svg%3E" />
    <script>
      // the theme before the first paint: the one you chose, else the system's
      try {
        var t = localStorage.getItem("classroom-theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
